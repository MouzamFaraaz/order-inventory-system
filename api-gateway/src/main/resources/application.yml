server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: order-service-api
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**, /orders/**
        - id: inventory-service-api
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/products/**, /products/**
        - id: notification-service-api
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**, /notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:8761/eureka/

jwt:
  secret: OrderInventorySecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmSafety!
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.orderinventory.gateway: DEBUG
